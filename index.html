<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a letter for you</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap');

  :root{
    --plum-deep:#241129;
    --plum-mid:#3B1F45;
    --rose:#E85D8C;
    --rose-deep:#B23A63;
    --gold:#D9B44A;
    --parchment:#F6ECD9;
    --parchment-dark:#EADFC7;
    --ink:#3A1220;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(ellipse at 50% 0%, var(--plum-mid), var(--plum-deep) 70%);
    font-family:'Poppins',sans-serif;
    color:var(--parchment);
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
  }

  /* ---------- twinkling stars ---------- */
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .star{
    position:absolute;
    width:3px; height:3px;
    background:var(--gold);
    border-radius:50%;
    opacity:.7;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.25; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.6); }
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:440px;
  }

  h1,.script{
    font-family:'Parisienne',cursive;
    font-weight:400;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    text-align:center;
    margin-bottom:10px;
  }

  /* ---------- ENVELOPE ---------- */
  #envelope-scene{ text-align:center; }
  .envelope{
    position:relative;
    width:280px;
    height:190px;
    margin:0 auto;
    cursor:pointer;
    perspective:1000px;
  }
  .env-body{
    position:absolute; inset:0;
    background:linear-gradient(160deg, var(--parchment-dark), var(--parchment));
    border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .env-body::before,
  .env-body::after{
    content:"";
    position:absolute;
    bottom:0;
    width:0; height:0;
    border-style:solid;
  }
  .env-body::before{
    left:0;
    border-width:0 0 95px 140px;
    border-color:transparent transparent rgba(178,58,99,.10) transparent;
  }
  .env-body::after{
    right:0;
    border-width:0 140px 95px 0;
    border-color:transparent transparent rgba(178,58,99,.10) transparent;
  }
  .env-flap{
    position:absolute;
    top:0; left:0;
    width:100%; height:95px;
    background:linear-gradient(160deg, var(--rose-deep), var(--rose));
    clip-path:polygon(0 0, 100% 0, 50% 78%);
    transform-origin:top center;
    transition:transform .9s cubic-bezier(.6,.05,.3,1.4);
    z-index:3;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .envelope.open .env-flap{
    transform:rotateX(180deg);
  }
  .seal{
    position:absolute;
    top:56px; left:50%;
    transform:translate(-50%,0);
    width:46px; height:46px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e2b45a, var(--gold) 60%, #a97f22 100%);
    box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center;
    font-family:'Parisienne',cursive;
    font-size:22px;
    color:var(--plum-deep);
    z-index:4;
    transition:opacity .3s ease;
  }
  .envelope.open .seal{ opacity:0; }

  .env-letter-peek{
    position:absolute;
    left:8%; right:8%;
    bottom:0;
    height:70%;
    background:var(--parchment);
    border-radius:4px 4px 0 0;
    box-shadow:0 -2px 6px rgba(0,0,0,.08);
    transform:translateY(85%);
    transition:transform .7s cubic-bezier(.2,.9,.3,1.3) .35s;
    z-index:2;
  }
  .envelope.open .env-letter-peek{
    transform:translateY(6%);
  }

  .tap-hint{
    margin-top:22px;
    font-size:13px;
    letter-spacing:1px;
    color:var(--parchment);
    opacity:.6;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.4;} 50%{opacity:.85;} }

  /* ---------- LETTER CARD ---------- */
  .card{
    display:none;
    background:var(--parchment);
    color:var(--ink);
    border-radius:4px;
    padding:40px 32px 34px;
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,.45);
    position:relative;
    animation:riseIn .6s cubic-bezier(.2,1,.3,1) both;
  }
  .card.show{ display:block; }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(24px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .card::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(178,58,99,.25);
    pointer-events:none;
  }

  h1{
    font-size:30px;
    color:var(--rose-deep);
    margin:4px 0 22px;
    line-height:1.35;
  }

  p.note{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink);
    margin:0 0 24px;
  }

  .btn-row{
    display:flex;
    gap:16px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    min-height:70px;
    position:relative;
  }

  button{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    cursor:pointer;
    border:none;
  }

  /* wax seal YES button */
  .yes-btn{
    width:96px; height:96px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f0819f, var(--rose) 55%, var(--rose-deep) 100%);
    color:#fff;
    font-family:'Parisienne',cursive;
    font-size:22px;
    box-shadow:0 6px 0 #7d2645, 0 10px 20px rgba(0,0,0,.3);
    transition:transform .15s ease;
  }
  .yes-btn:hover{ transform:translateY(-2px) scale(1.03); }
  .yes-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #7d2645; }

  .no-btn{
    background:transparent;
    color:var(--rose-deep);
    border:1.5px solid var(--rose-deep);
    padding:10px 20px;
    border-radius:20px;
    font-size:14px;
    position:relative;
    transition:transform .25s cubic-bezier(.3,1.5,.5,1), font-size .25s ease, opacity .25s ease;
  }

  .hint{
    margin-top:14px;
    font-size:12.5px;
    color:var(--rose-deep);
    opacity:.75;
    min-height:16px;
    font-style:italic;
  }

  .gold-rule{
    width:60px; height:2px;
    background:var(--gold);
    margin:0 auto 18px;
    opacity:.6;
  }

  /* ---------- date picker screen ---------- */
  .field-group{ text-align:left; margin-bottom:16px; }
  label{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--rose-deep);
    margin-bottom:6px;
  }
  input[type="date"], input[type="time"], textarea{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--rose-deep);
    border-radius:8px;
    background:#fff;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  textarea{
    resize:vertical;
    min-height:64px;
    font-size:13.5px;
  }
  .row-2{ display:flex; gap:10px; }
  .row-2 .field-group{ flex:1; }

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:4px 0 22px;
  }
  .opt{
    background:#fff;
    border:1.5px solid var(--rose-deep);
    color:var(--rose-deep);
    padding:11px 6px;
    font-size:13px;
    border-radius:8px;
  }
  .opt.selected{
    background:var(--rose-deep);
    color:#fff;
  }

  .lock-btn{
    background:var(--gold);
    color:var(--plum-deep);
    padding:14px;
    font-size:14.5px;
    border-radius:10px;
    width:100%;
    box-shadow:0 5px 0 #a5852f;
    letter-spacing:.5px;
  }
  .lock-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .lock-btn:not(:disabled):active{ transform:translateY(3px); box-shadow:0 2px 0 #a5852f; }

  .from-line{
    margin-top:26px;
    font-family:'Parisienne',cursive;
    font-size:22px;
    color:var(--rose-deep);
  }

  .hidden{ display:none !important; }

  /* ---------- sound toggle ---------- */
  .sound-toggle{
    position:fixed;
    top:18px; right:18px;
    z-index:10;
    width:42px; height:42px;
    border-radius:50%;
    background:rgba(246,236,217,.12);
    border:1.5px solid var(--gold);
    color:var(--gold);
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }

  /* ---------- photo frame ---------- */
  .photo-frame{
    width:110px; height:110px;
    margin:0 auto 18px;
    border-radius:50%;
    border:3px solid var(--gold);
    box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 0 0 3px var(--parchment);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--blush,#FFE3EC);
    font-size:38px;
  }
  .photo-frame img{
    width:100%; height:100%;
    object-fit:cover;
  }

  /* ---------- countdown ---------- */
  .countdown{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:6px 0 22px;
  }
  .countdown .unit{
    background:#fff;
    border:1.5px solid var(--rose-deep);
    border-radius:8px;
    padding:10px 6px;
    min-width:56px;
  }
  .countdown .num{
    font-size:20px;
    font-weight:700;
    color:var(--rose-deep);
    line-height:1;
  }
  .countdown .lbl{
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--rose-deep);
    opacity:.7;
    margin-top:4px;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<button class="sound-toggle" id="soundToggle" onclick="toggleSound()" aria-label="Toggle music">🔇</button>
<audio id="songPlayer" loop></audio>

<div class="stage">

  <!-- ENVELOPE -->
  <div id="envelope-scene">
    <div class="eyebrow" id="to-line">for you</div>
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="env-letter-peek"></div>
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="seal">E</div>
    </div>
    <div class="tap-hint">tap the envelope to open</div>
  </div>

  <!-- SCREEN 1: THE QUESTION -->
  <div class="card" id="screen-ask">
    <div class="eyebrow">a question</div>
    <h1 id="ask-heading">Would you like to go<br>on a date with me,<br><span id="name-slot">—</span>?</h1>
    <div class="gold-rule"></div>
    <div class="btn-row" id="askRow">
      <button class="yes-btn" onclick="sayYes()">Yes</button>
      <button class="no-btn" id="noBtn"
        onmouseenter="dodge()" ontouchstart="dodge(); event.preventDefault();"
        onclick="dodge()">No</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <!-- SCREEN 2: SWEET REVEAL -->
  <div class="card hidden" id="screen-yay">
    <div class="eyebrow">yay</div>
    <div class="photo-frame" id="photoFrameYay">💛</div>
    <h1 style="font-size:26px;">You said yes.</h1>
    <p class="note" id="yay-note"></p>
    <button class="yes-btn" style="border-radius:24px; width:auto; height:auto; padding:13px 28px; font-family:'Poppins',sans-serif; font-size:14px; font-weight:600;" onclick="goToPlan()">choose our date →</button>
  </div>

  <!-- SCREEN 3: DATE PICKER -->
  <div class="card hidden" id="screen-plan">
    <div class="eyebrow">let's plan it</div>
    <h1 style="font-size:22px;">When and what<br>should we do?</h1>
    <div class="row-2">
      <div class="field-group">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" oninput="checkReady()">
      </div>
      <div class="field-group">
        <label for="timeInput">Time</label>
        <input type="time" id="timeInput" oninput="checkReady()">
      </div>
    </div>
    <div class="options">
      <button class="opt" onclick="pick(this,'dinner')">Dinner date</button>
      <button class="opt" onclick="pick(this,'movie')">Movie night</button>
      <button class="opt" onclick="pick(this,'coffee')">Coffee & walk</button>
      <button class="opt" onclick="pick(this,'picnic')">Picnic</button>
      <button class="opt" onclick="pick(this,'golf')">Mini golf</button>
      <button class="opt" onclick="pick(this,'surprise')">Surprise me</button>
    </div>
    <p class="note" id="activity-preview" style="min-height:20px;font-style:italic;font-size:13px;"></p>

    <div class="field-group">
      <label for="herMessage">A message for <span id="sender-slot-2"></span> (optional)</label>
      <textarea id="herMessage" placeholder="Say something back..."></textarea>
    </div>

    <button class="lock-btn" id="lockBtn" disabled onclick="lockIn()">Lock it in</button>
  </div>

  <!-- SCREEN 4: CLOSING NOTE -->
  <div class="card hidden" id="screen-final">
    <div class="eyebrow">it's settled</div>
    <div class="photo-frame" id="photoFrameFinal">💛</div>
    <h1 style="font-size:24px;" id="final-heading"></h1>
    <div class="gold-rule"></div>
    <p class="note" id="final-note"></p>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="cd-days">0</div><div class="lbl">days</div></div>
      <div class="unit"><div class="num" id="cd-hours">0</div><div class="lbl">hrs</div></div>
      <div class="unit"><div class="num" id="cd-mins">0</div><div class="lbl">min</div></div>
      <div class="unit"><div class="num" id="cd-secs">0</div><div class="lbl">sec</div></div>
    </div>

    <p class="note" id="final-message" style="font-style:italic;"></p>
    <div class="from-line" id="from-line"></div>

    <button class="lock-btn" id="replyBtn" style="margin-top:18px;background:var(--rose-deep);color:#fff;box-shadow:0 5px 0 #7d2645;" onclick="sendReply()">Send my answer to <span id="sender-slot"></span> 💌</button>
    <div id="replyHint" style="font-size:11.5px;opacity:.6;margin-top:8px;"></div>
  </div>

</div>

<script>
  /* ============ EDIT PER RECIPIENT (or pass as URL params) ============
     Example: date-invite.html?name=Jenna&message=You%20make%20every%20day%20better.
  ======================================================================= */
  const params = new URLSearchParams(window.location.search);

  const RECIPIENT = params.get('name') || "Jenna";
  const SENDER = params.get('from') || "Erick";
  const CLOSING_MESSAGE = params.get('message') ||
    "Every time I'm with you the rest of the world gets quiet. I can't wait for this one.";

  const PHOTO_URL = params.get('photo') || ""; // e.g. ?photo=https://example.com/us.jpg
  const CONTACT = params.get('contact') || ""; // Erick's email OR phone, e.g. ?contact=erick@email.com or ?contact=+15551234567
  const SONG_URL = params.get('song') || "";   // path/URL to a song file YOU legally own, e.g. ?song=perfect.mp3

  // Each activity: display label + its own message shown once picked & on the closing screen
  const ACTIVITIES = {
    dinner:   { label: "Dinner date",     msg: "Let's slow everything down — candlelight, good food, and just us with no rush at all." },
    movie:    { label: "Movie night",     msg: "Blankets, popcorn, and you falling asleep on my shoulder halfway through. My favorite kind of night." },
    coffee:   { label: "Coffee & a walk", msg: "Something about a slow walk and easy conversation with you beats almost anything else." },
    picnic:   { label: "A picnic",        msg: "Sunshine, a blanket, and you next to me — that's really the whole plan." },
    golf:     { label: "Mini golf",       msg: "I'm terrible at this, you're going to win, and I'm still going to have the best time." },
    surprise: { label: "Surprise me",     msg: "I already have something in mind. You just have to trust me on this one." }
  };

  document.getElementById('name-slot').textContent = RECIPIENT;
  document.getElementById('to-line').textContent = `for ${RECIPIENT}`;
  document.getElementById('final-message').textContent = `"${CLOSING_MESSAGE}"`;
  document.getElementById('from-line').textContent = `— ${SENDER}`;
  document.getElementById('sender-slot').textContent = SENDER;
  document.getElementById('sender-slot-2').textContent = SENDER;

  if(PHOTO_URL){
    ['photoFrameYay','photoFrameFinal'].forEach(id=>{
      const frame = document.getElementById(id);
      frame.innerHTML = `<img src="${PHOTO_URL}" alt="us">`;
    });
  }

  // Reply button only makes sense if a contact was provided
  // Reply is now automatic (see autoSendReply) — this button only appears as a fallback if that fails
  document.getElementById('replyBtn').style.display = 'none';

  if(SONG_URL){
    document.getElementById('songPlayer').src = SONG_URL;
  }

  /* stars */
  const starsEl = document.getElementById('stars');
  for(let i=0;i<50;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*3) + 's';
    s.style.animationDuration = (2 + Math.random()*3) + 's';
    starsEl.appendChild(s);
  }

  function openEnvelope(){
    const env = document.getElementById('envelope');
    if(env.classList.contains('open')) return;
    ensureAudio();
    sfxSeal();
    startMusic();
    env.classList.add('open');
    document.querySelector('.tap-hint').style.opacity = '0';
    setTimeout(()=>{
      document.getElementById('envelope-scene').style.display = 'none';
      document.getElementById('screen-ask').classList.add('show');
    }, 900);
  }

  const noPhrases = [
    "wait, no", "are you sure?", "hmm, try again", "don't do that 🥺",
    "one more try", "come on now", "last chance", "nooo not that one"
  ];
  let dodgeCount = 0;
  function dodge(){
    sfxBlip();
    const btn = document.getElementById('noBtn');
    const row = document.getElementById('askRow');
    const rowRect = row.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();

    const maxX = Math.max(0, rowRect.width - btnRect.width);
    const x = Math.random() * maxX - maxX/2;
    const y = (Math.random() * 50) - 25;

    btn.style.position = 'relative';
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';

    dodgeCount++;
    const scale = Math.max(0.35, 1 - dodgeCount * 0.07);
    btn.style.transform = `scale(${scale})`;
    if(dodgeCount > 4){ btn.style.opacity = Math.max(0.35, 1 - dodgeCount*0.06); }

    document.getElementById('hint').textContent =
      noPhrases[Math.min(dodgeCount-1, noPhrases.length-1)];
  }

  function sayYes(){
    sfxChime();
    document.getElementById('screen-ask').classList.remove('show');
    document.getElementById('screen-ask').classList.add('hidden');
    document.getElementById('screen-yay').classList.remove('hidden');
    document.getElementById('screen-yay').classList.add('show');
    document.getElementById('yay-note').textContent =
      `I've been hoping you'd say that, ${RECIPIENT}.`;
  }

  function goToPlan(){
    document.getElementById('screen-yay').classList.remove('show');
    document.getElementById('screen-yay').classList.add('hidden');
    document.getElementById('screen-plan').classList.remove('hidden');
    document.getElementById('screen-plan').classList.add('show');
  }

  let chosenKey = null;
  function pick(el, key){
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    chosenKey = key;
    document.getElementById('activity-preview').textContent = `"${ACTIVITIES[key].msg}"`;
    checkReady();
  }
  function checkReady(){
    const d = document.getElementById('dateInput').value;
    const t = document.getElementById('timeInput').value;
    document.getElementById('lockBtn').disabled = !(d && t && chosenKey);
  }

  function lockIn(){
    const d = document.getElementById('dateInput').value;
    const t = document.getElementById('timeInput').value;
    const dateObj = new Date(d + 'T' + t);
    const prettyDate = dateObj.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
    const prettyTime = dateObj.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });

    document.getElementById('screen-plan').classList.remove('show');
    document.getElementById('screen-plan').classList.add('hidden');
    document.getElementById('screen-final').classList.remove('hidden');
    document.getElementById('screen-final').classList.add('show');
    document.getElementById('final-heading').textContent = `${ACTIVITIES[chosenKey].label}, ${prettyDate}`;
    document.getElementById('final-note').textContent = `${prettyTime} — I'll take care of the rest.`;
    document.getElementById('final-message').textContent = `"${ACTIVITIES[chosenKey].msg}"`;

    startCountdown(dateObj);

    const herMessage = document.getElementById('herMessage').value.trim();

    autoSendReply({
      activity: ACTIVITIES[chosenKey].label,
      prettyDate, prettyTime, herMessage
    });
  }

  /* ============================================================
     AUTOMATIC REPLY — sent silently the moment she locks in her
     answer, straight to Erick's inbox. No action needed from her.
     Powered by FormSubmit.co (free, no account needed on their side).
  ============================================================= */
  const ERICK_EMAIL = "erickdeogratiusmoshi@gmail.com";

  function autoSendReply({ activity, prettyDate, prettyTime, herMessage }){
    fetch(`https://formsubmit.co/ajax/${ERICK_EMAIL}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: `💌 ${RECIPIENT} said YES!`,
        name: RECIPIENT,
        answer: "YES",
        activity: activity,
        date: prettyDate,
        time: prettyTime,
        her_message: herMessage || "(no message left)",
        message: `${RECIPIENT} said yes and picked "${activity}" for ${prettyDate} at ${prettyTime}.\n\nHer message: ${herMessage || "(none)"}`
      })
    }).then(()=>{
      const hint = document.getElementById('replyHint');
      if(hint) hint.textContent = `Sent to ${SENDER} ✓`;
    }).catch(()=>{
      const hint = document.getElementById('replyHint');
      if(hint) hint.textContent = `Couldn't auto-send — tap below to send manually.`;
      const btn = document.getElementById('replyBtn');
      if(btn){
        btn.style.display = 'block';
        window._replyData = { activity, prettyDate, prettyTime, herMessage };
      }
    });
  }

  function sendReply(){
    // Manual fallback only — used if the automatic send above fails
    if(!window._replyData) return;
    const { activity, prettyDate, prettyTime, herMessage } = window._replyData;
    const subject = `Yes! ${RECIPIENT} said yes 💌`;
    const body = `${RECIPIENT} said YES and picked: ${activity}\n${prettyDate} at ${prettyTime}\n\nHer message: ${herMessage || "(none)"}`;
    window.location.href = `mailto:${ERICK_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  /* ---------- countdown ---------- */
  let countdownTimer = null;
  function startCountdown(targetDate){
    if(countdownTimer) clearInterval(countdownTimer);
    const tick = () => {
      const diff = targetDate.getTime() - Date.now();
      const cdEl = document.getElementById('countdown');
      if(diff <= 0){
        clearInterval(countdownTimer);
        cdEl.innerHTML = `<div class="unit" style="min-width:auto;padding:12px 18px;">
          <div class="num" style="font-size:16px;">it's today 🎉</div></div>`;
        return;
      }
      const s = Math.floor(diff/1000);
      document.getElementById('cd-days').textContent = Math.floor(s/86400);
      document.getElementById('cd-hours').textContent = Math.floor((s%86400)/3600);
      document.getElementById('cd-mins').textContent = Math.floor((s%3600)/60);
      document.getElementById('cd-secs').textContent = s%60;
    };
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  /* ============================================================
     SOUND — soft ambient music-box loop + gentle sound effects.
     Built with the Web Audio API, no external audio files needed.
  ============================================================= */
  let audioCtx = null;
  let musicOn = false;
  let musicLoopId = null;

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function pluck(freq, time, dur=0.9, gainPeak=0.05){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(gainPeak, time + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + dur + 0.05);
  }

  // gentle music-box style arpeggio, loops softly in the background
  const melody = [523.25, 659.25, 783.99, 659.25, 587.33, 783.99, 987.77, 783.99]; // C E G E D G B G
  let melodyStep = 0;
  function scheduleMusicStep(){
    if(!musicOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    pluck(melody[melodyStep % melody.length], now, 1.6, 0.045);
    melodyStep++;
    musicLoopId = setTimeout(scheduleMusicStep, 700);
  }

  function startMusic(){
    const btn = document.getElementById('soundToggle');
    const songEl = document.getElementById('songPlayer');

    if(SONG_URL){
      songEl.play().catch(()=>{}); // ignore if browser still blocks it
      btn.textContent = '🔊';
      return;
    }

    ensureAudio();
    musicOn = true;
    btn.textContent = '🔊';
    melodyStep = 0;
    scheduleMusicStep();
  }

  function toggleSound(){
    const btn = document.getElementById('soundToggle');
    const songEl = document.getElementById('songPlayer');

    if(SONG_URL){
      if(songEl.paused){
        songEl.play();
        btn.textContent = '🔊';
      }else{
        songEl.pause();
        btn.textContent = '🔇';
      }
      return;
    }

    ensureAudio();
    musicOn = !musicOn;
    if(musicOn){
      btn.textContent = '🔊';
      melodyStep = 0;
      scheduleMusicStep();
    }else{
      btn.textContent = '🔇';
      clearTimeout(musicLoopId);
    }
  }

  function sfxChime(){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    pluck(523.25, now, 0.7, 0.07);
    pluck(659.25, now + 0.12, 0.7, 0.07);
    pluck(783.99, now + 0.24, 0.9, 0.07);
  }

  function sfxBlip(){
    if(!audioCtx) return;
    pluck(392, audioCtx.currentTime, 0.25, 0.05);
  }

  function sfxSeal(){
    if(!audioCtx) return;
    pluck(220, audioCtx.currentTime, 0.5, 0.06);
  }
</script>

</body>
